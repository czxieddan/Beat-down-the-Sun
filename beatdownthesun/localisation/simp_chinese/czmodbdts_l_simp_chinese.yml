 bdts_mod.1.desc: "Beat down the Sun:(Alpha-0.0.3)\n简介\n    随着迎接2025元旦的钟声敲响，一场巨大而不可阻挡的动荡即将席卷全球。自步入21世纪以来，冷战的铁幕已然褪去，千禧年代后的飞速发展，看似祥和宁静的世界背后，又暗藏着怎样的波涛。面对风云变幻的局势，被赋予命运的人民和与他们所信任的政府该如何驾驭这变幻莫测的局面？。 在旧秩序挥之不去的阴霾中，又会由谁带头挑起反抗的大旗？谁又将重新成为新时代的缔造者？秩序更迭间，随着命运之轮的转动，有多少国家将在荣耀中崛起，却又在默默无闻中衰落？ 在命运的召唤下，他们都将踏上怎样一番征途……\n声明\n    - 本作当前仍在极早期制作阶段，暂时无法游玩，仅为本人交流所传，作品中可能有对他人作品借鉴，侵权请告知。\n    - 内容中含有不平衡内容，不代表本人任何政治观点与偏见。\n内容\n    东亚地区当前正经历着细致入微的完善，其错综复杂的地貌与悠远绵长的历史正交织成一幅宏伟的发展画卷……\n提示\n    - 本modGUI仅为2560*1440分辨率适配，如果您使用更小的分辨率游玩该作可能致使部分窗口超出屏幕导致您无法正常体验。\n    LICENSE\nhttps://github.com/czxieddan/Beat-down-the-Sun/blob/main/LICENSE\n联系\n    您可以在我的个人博客界面[czxieddan.top]或以通过向 czxieddan@czxieddan.top 发送电子邮件的方式联系我。\n版本核查\n    您当前的§0 Beat down the Sun §!版本为[get_bdts_vid]"
 
